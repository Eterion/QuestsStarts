name: Release QuestsStarts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in QuestsStarts.toc (without v)
        required: true
        type: string
      notes:
        description: User-visible release notes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: questsstarts-release
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/master' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check version, rebuild data, and package
        id: build
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $toc = Get-Content addon/QuestsStarts/QuestsStarts.toc -Raw
          $version = [regex]::Match($toc, '(?m)^## Version:[ \t]*(\d+\.\d+\.\d+)[ \t]*\r?$').Groups[1].Value
          if (-not $version -or $env:RELEASE_VERSION -cne $version) {
              throw 'Requested version must match QuestsStarts.toc.'
          }
          $revision = (Get-Content tools/upstream-revision.txt -Raw).Trim()
          git init work/QuestieDB
          git -C work/QuestieDB fetch --depth 1 https://github.com/Questie/QuestieDB.git $revision
          git -C work/QuestieDB checkout --detach FETCH_HEAD
          ./tools/build.ps1
          git diff --exit-code -- addon
          ./tools/package.ps1
          "path=dist/v$version/" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: questsstarts-package
          path: ${{ steps.build.outputs.path }}
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: questsstarts-package
          path: package
      - name: Publish stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          tag="v$RELEASE_VERSION"
          asset="package/QuestsStarts-$RELEASE_VERSION.zip"
          test -s "$asset"
          test -s package/release.json
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" --silent 2>/dev/null; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" "$asset" package/release.json \
            --target "$GITHUB_SHA" --title "QuestsStarts $tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest
